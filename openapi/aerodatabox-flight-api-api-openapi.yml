          description: Error message
      additionalProperties: false
      description: Error response
    FlightPlanContract:
      required:
      - lastUpdatedUtc
      - route
      type: object
      properties:
        flightRules:
          $ref: '#/components/schemas/FlightRules'
        flightType:
          $ref: '#/components/schemas/FlightType'
        revisionNo:
          type:
          - integer
          - 'null'
          description: No. of revision of the flight plan
          format: int32
        status:
          $ref: '#/components/schemas/FlightPlanStatus'
        route:
          minLength: 1
          type: string
          description: Route information for the flight as filed in the flight plan
        altitude:
          $ref: '#/components/schemas/DistanceFlightPlanUnitContract'
        airspeed:
          $ref: '#/components/schemas/SpeedFlightPlanUnitContract'
        lastUpdatedUtc:
          type: string
          description: Time (UTC) of the latest known update to the flight plan
          format: date-time
      additionalProperties: false
      description: Flight plan contract
    StringFlightSearchItemContractSearchResultCollectionContract:
      required:
      - count
      - items
      - searchBy
      type: object
      properties:
        searchBy:
          minLength: 1
          type: string
          description: "Search parameter used to find the result. \nPlease note, it may be different from the actual input provided!"
        count:
          maximum: 2147483647
          minimum: 0
          type: integer
          description: The number of items in the collection
          format: int32
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/FlightSearchItemContract'
          description: The collection of items
      additionalProperties: false
    CodeshareStatus:
      enum:
      - Unknown
      - IsOperator
      - IsCodeshared
      type: string
      description: 'Flight code-share status<p>Possible values:</p>

        <ul>

        <li><b>0 - Unknown</b>: Code-sharing information is unavailable for this flight. Flight might be operated both by airline owning the flight number as well as by another airliner.</li>

        <li><b>1 - IsOperator</b>: Flight is operated by an airline owning the flight number (the same code)</li>

        <li><b>2 - IsCodeshared</b>: Flight is code-shared (operated by an airline other than airline owning the flight number)</li>

        </ul>

        '
    FlightSearchByEnum:
      enum:
      - Number
      - Reg
      - CallSign
      - Icao24
      type: string
      description: 'Criteria to search flight by<p>Possible values:</p>

        <ul>

        <li><b>0 - Number</b>: Search by flight number</li>

        <li><b>1 - Reg</b>: Search by aircraft registration</li>

        <li><b>2 - CallSign</b>: Search by ATC call-sign</li>

        <li><b>3 - Icao24</b>: Search by 24-bit ICAO Mode-S Transponder code</li>

        </ul>

        '
    Pressure:
      required:
      - hPa
      - inHg
      - mmHg
