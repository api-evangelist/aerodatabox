openapi: 3.2.0
info:
  title: AeroDataBox API - Aviation and Flight Flight API
  description: Affordable aviation & flight data API tailored for small and medium businesses, teams and individual developers.
  termsOfService: https://aerodatabox.com/terms/
  contact:
    url: https://aerodatabox.com/contact/
  version: 1.14.0.0
servers:
- url: https://prod.api.market/api/v1/aedbx/aerodatabox
security: {}
tags:
- name: Flight API
paths:
  /flights/{searchBy}/{searchParam}:
    parameters:
    - description: API.market API Key
      in: header
      name: x-api-market-key
      value: Please Login/Signup to get an API Key
      required: true
      schema:
        type: string
    get:
      tags:
      - Flight API
      summary: AeroDataBox Flight Status (single Day) / TIER 2
      description: '**What is the status of a specific flight?**

        **What is the historical status or schedule of a specific flight on a specific date in past or in future?**


        This endpoint returns data about a specific flight live flight status (if the flight is within the coverage and not in distant future),

        or flight schedule data otherwise.


        If `dateLocal` is specified, gets data about flight(s) departing or arriving on the day specified (local time).

        Otherwise, gets data about the status of flight(s) operating on the nearest date (either in past or in future).


        A flight can be searched by:

        * flight number it''s being operated under; or

        * ATC-callsign it''s being operated under; or

        * tail-number of the aircraft it''s being operated by; or

        * Mode-S 24-bit ICAO Transponder address of the aircraft it''s being operated by.


        Flight data may include airport of arrival and departure, scheduled and actual times, flight status, type of aircraft,

        tail-number and aircraft image.


        Some flights may have partial data. The data may be absent for either arrival

        or departure airport or may not include live updates of time and status. Check quality markers inside the response to

        determine which data is available.


        Normally, information with live status updates and estimated/actual arrival/departure times is only available

        for airports tracked live or with ADS-B by our system. Otherwise flight information will be with scheduled info only

        or absent.


        To check if an airport is currently tracked and on which level,

        use `/health/services/airports/{icao}/feeds` endpoint. You can also use `/health/services/feeds/{service}/airports` to get

        the list of covered airports.


        Read more about coverage and flight data limitations here: https://www.aerodatabox.com/data-coverage.'
      operationId: GetFlight_FlightNearest
      parameters:
      - name: searchBy
        in: path
        description: Criteria to search flight by
        schema:
          $ref: '#/components/schemas/FlightSearchByEnum'
      - name: searchParam
        in: path
        description: "Value of the search criteria. If `searchBy` is: \n* `number`, then this field shoud be Flight number (with or without spaces, IATA or ICAO, any case formats are acceptable, e.g. KL1395, Klm 1395)\n* `callsign`, then this field should be ATC call-sign of the flight (with or without spaces, any case formats are acceptable, e.g.AFL1482, nca 008X);\n* `reg`, then this field should be Aircraft tail-number (with or without spaces or dashes, any case formats are acceptable, e.g.PH-BXO, DeMhJ);\n* `icao24`, then this field should be Aircraft ICAO 24-bit Mode-S address specified in hexadecimal format (e.g. 484161, 483EFD)."
        required: true
        schema:
          maxLength: 10
          type: string
      - name: dateLocalRole
        in: query
        description: '* If set to `Both` (default, recommended for best results) then the dateLocal parameter shall be considered as both departure and arrival date. If a flight departs OR arrives on that date (in the local timezone of the origin or destination, respectively), it will be returned.

          * If set to `Departure` then the dateLocal parameter shall be considered as departure date only. Only the flights departing on that date (in the local timezone of origin) will be returned.

          * If set to `Arrival` then the dateLocal parameter shall be considered as arrival date only. Only the flights arriving on that date (in the local timezone of destination) will be returned.'
        schema:
          $ref: '#/components/schemas/FlightDirection'
      - name: withAircraftImage
        in: query
        description: "Should include aircraft image (default: false).\n\nAircraft images are being searched in external sources by certain criteria without any manual intervention. \nTherefore, false matches may be returned. Only images with licenses approved for commercial use are returned. \nPlease be advised that you may be required to mention author attribution before using the image."
        schema:
          type: boolean
          default: false
      - name: withLocation
        in: query
        description: 'Should include real-time positional data, e.g.: location, speed, altitude, etc., if available (default: false).'
        schema:
          type: boolean
          default: false
      - name: withFlightPlan
        in: query
        description: 'Should include the flight plan filed with the ATC for the flight (default: false).


          * NOTE 1: Generally availabe to flights departing from, arriving to or crossing the mainland U.S. airspace.

          * NOTE 2: Only available on Basic and Ultra, Ultra-2 and Mega pricing plans.

          * NOTE 3: If set to true and the flight plan is found for one or more flights returned, **the request will be billed as 2 requests** against your API quota (except on Mega plan).'
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlightContract'
              examples:
                GetFlight_FlightNearest200Example:
                  summary: Default GetFlight_FlightNearest 200 response
                  x-microcks-default: true
                  value:
                  - example_value
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlightContract'
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
              examples:
                GetFlight_FlightNearest400Example:
                  summary: Default GetFlight_FlightNearest 400 response
                  x-microcks-default: true
                  value:
                    message: example_value
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
              examples:
                GetFlight_FlightNearest401Example:
                  summary: Default GetFlight_FlightNearest 401 response
                  x-microcks-default: true
                  value:
                    message: example_value
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '451':
          description: Unavailable For Legal Reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
              examples:
                GetFlight_FlightNearest451Example:
                  summary: Default GetFlight_FlightNearest 451 response
                  x-microcks-default: true
                  value:
                    message: example_value
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
              examples:
                GetFlight_FlightNearest500Example:
                  summary: Default GetFlight_FlightNearest 500 response
                  x-microcks-default: true
                  value:
                    message: example_value
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '503':
          description: Service Unavailable
      x-badges:
      - name: TIER 2
        position: before
        color: '#aab6f8'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
