components:
  schemas:
    AirportFlightContract:
      required:
      - codeshareStatus
      - isCargo
      - number
      - status
      type: object
      properties:
        movement:
          $ref: '#/components/schemas/FlightAirportMovementContract'
        departure:
          $ref: '#/components/schemas/FlightAirportMovementContract'
        arrival:
          $ref: '#/components/schemas/FlightAirportMovementContract'
        number:
          minLength: 1
          type: string
          description: Flight Number
        callSign:
          type:
          - string
          - 'null'
          description: ATC call-sign of the flight
        status:
          $ref: '#/components/schemas/FlightStatus'
        codeshareStatus:
          $ref: '#/components/schemas/CodeshareStatus'
        isCargo:
          type: boolean
          description: Is cargo flight
        aircraft:
          $ref: '#/components/schemas/FlightAircraftContract'
        airline:
          $ref: '#/components/schemas/FlightAirlineContract'
        location:
          $ref: '#/components/schemas/FlightLocationContract'
      additionalProperties: false
      description: Flight data contract represented in airport schedule
    FlightPlanStatus:
      enum:
      - Proposed
      - Active
      - Dropped
      - Cancelled
      - Completed
      type: string
    LicenseType:
      enum:
      - AllRightsReserved
      - AttributionNoncommercialShareAlikeCC
      - AttributionNoncommercialCC
      - AttributionNoncommercialNoDerivativesCC
      - AttributionCC
      - AttributionShareAlikeCC
      - AttributionNoDerivativesCC
      - NoKnownCopyrightRestrictions
      - UnitedStatesGovernmentWork
      - PublicDomainDedicationCC0
      - PublicDomainMark
      type: string
      description: '<p>Possible values:</p>

        <ul>

        <li><b>0 - AllRightsReserved</b>: All Rights Reserved.</li>

        <li><b>1 - AttributionNoncommercialShareAlikeCC</b>: Creative Commons: Attribution Non-Commercial, Share-alike License.</li>

        <li><b>2 - AttributionNoncommercialCC</b>: Creative Commons: Attribution Non-Commercial License.</li>

        <li><b>3 - AttributionNoncommercialNoDerivativesCC</b>: Creative Commons: Attribution Non-Commercial, No Derivatives License.</li>

        <li><b>4 - AttributionCC</b>: Creative Commons: Attribution License.</li>

        <li><b>5 - AttributionShareAlikeCC</b>: Creative Commons: Attribution Share-alike License.</li>

        <li><b>6 - AttributionNoDerivativesCC</b>: Creative Commons: Attribution No Derivatives License.</li>

        <li><b>7 - NoKnownCopyrightRestrictions</b>: No Known Copyright Resitrctions (Flickr Commons).</li>

        <li><b>8 - UnitedStatesGovernmentWork</b>: United States Government Work</li>

        <li><b>9 - PublicDomainDedicationCC0</b>: Public Domain Dedication, CC0</li>

        <li><b>10 - PublicDomainMark</b>: Public Domain Mark</li>

        </ul>

        '
    Speed:
      required:
      - kmPerHour
      - kt
      - meterPerSecond
      - miPerHour
      type: object
      properties:
        kt:
          type: number
          description: Speed in knots
          format: double
        kmPerHour:
          type: number
          description: Speed in km per hour
          format: double
        miPerHour:
          type: number
          description: Speed in miles per hour
          format: double
        meterPerSecond:
          type: number
          description: Speed in meters per second
          format: double
      additionalProperties: false
    FlightType:
      enum:
      - Other
      - General
      - Scheduled
      - NonScheduled
      - Military
      type: string
    AirportFidsContract:
      type: object
      properties:
        departures:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AirportFlightContract'
          description: Departing flights
        arrivals:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AirportFlightContract'
          description: Arriving flights
      additionalProperties: false
      description: Airport schedule contract
    DistanceFlightPlanUnitContract:
      type: object
      properties:
        requested:
          $ref: '#/components/schemas/Distance'
        assigned:
          $ref: '#/components/schemas/Distance'
      additionalProperties: false
      description: 'Contract describing unit (altitude, airspeed, etc.) which can be assigned and / or requested

        in the context of the flight plan'
    SpeedFlightPlanUnitContract:
      type: object
      properties:
        requested:
          $ref: '#/components/schemas/Speed'
        assigned:
          $ref: '#/components/schemas/Speed'
      additionalProperties: false
      description: 'Contract describing unit (altitude, airspeed, etc.) which can be assigned and / or requested

        in the context of the flight plan'
    ListingAirportContract:
      required:
      - name
      type: object
      properties:
        icao:
          type:
          - string
          - 'null'
          description: ICAO code of the airport
        iata:
          type:
          - string
          - 'null'
          description: IATA code of the airport
        localCode:
          type:
          - string
          - 'null'
          description: Code of the airport within the local or national codification system
        name:
          minLength: 1
          type: string
          description: Name of the airport
        shortName:
          type:
          - string
          - 'null'
          description: Shortened name of the airport
        municipalityName:
          type:
          - string
          - 'null'
          description: Name of the municipality this airport belongs to
        location:
          $ref: '#/components/schemas/GeoCoordinatesContract'
        countryCode:
          type:
          - string
          - 'null'
          description: Two-letter country code of the airport
        timeZone:
          type:
          - string
          - 'null'
          description: Time zone of the airport in Olson format (e.g. "Europe/Amsterdam")
      additionalProperties: false
      description: Flight's airport reference contract
    FlightDirection:
      enum:
      - Arrival
      - Departure
      - Both
      type: string
      description: 'Direction of flight<p>Possible values:</p>

        <ul>

        <li><b>1 - Arrival</b></li>

        <li><b>2 - Departure</b></li>

        <li><b>3 - Both</b></li>

        </ul>

        '
    FlightStatus:
      enum:
      - Unknown
      - Expected
      - EnRoute
      - CheckIn
      - Boarding
      - GateClosed
      - Departed
      - Delayed
      - Approaching
      - Arrived
      - Canceled
      - Diverted
      - CanceledUncertain
      type: string
      description: 'Flight progress status<p>Possible values:</p>

        <ul>

        <li><b>0 - Unknown</b>: Status is not available for this flight</li>

        <li><b>1 - Expected</b>: Expected</li>

        <li><b>2 - EnRoute</b>: En route</li>

        <li><b>3 - CheckIn</b>: Check-in is open</li>

        <li><b>4 - Boarding</b>: Boarding in progress / Last call</li>

        <li><b>5 - GateClosed</b>: Gate closed</li>

        <li><b>6 - Departed</b>: Departed</li>

        <li><b>7 - Delayed</b>: Delayed</li>

        <li><b>8 - Approaching</b>: On approach to destination</li>

        <li><b>9 - Arrived</b>: Arrived</li>

        <li><b>10 - Canceled</b>: Cancelled</li>

        <li><b>11 - Diverted</b>: Diverted to another destination</li>

        <li><b>12 - CanceledUncertain</b>: Status of the flight is uncertain, may be cancelled</li>

        </ul>

        '
    FlightAircraftContract:
      type: object
      properties:
        reg:
          type:
          - string
          - 'null'
          description: Tail-number of the aircraft
        modeS:
          type:
          - string
          - 'null'
          description: ICAO 24 bit Mode-S hexadecimal transponder address
        model:
          type:
          - string
          - 'null'
          description: Aircraft name and model
        image:
          $ref: '#/components/schemas/ResourceContract'
      additionalProperties: false
      description: Flight's aircraft reference contract
    FlightAirportMovementContract:
      required:
      - airport
      - quality
      type: object
      properties:
        airport:
          $ref: '#/components/schemas/ListingAirportContract'
        scheduledTime:
          $ref: '#/components/schemas/DateTimeContract'
        revisedTime:
          $ref: '#/components/schemas/DateTimeContract'
        predictedTime:
          $ref: '#/components/schemas/DateTimeContract'
        runwayTime:
          $ref: '#/components/schemas/DateTimeContract'
        terminal:
          type:
          - string
          - 'null'
          description: Terminal of the flight
        checkInDesk:
          type:
          - string
          - 'null'
          description: Check-in desk(s) for the flight (only for departing flights)
        gate:
          type:
          - string
          - 'null'
          description: Gate of (un)boarding for the flight
        baggageBelt:
          type:
          - string
          - 'null'
          description: Baggage belt(s) for the flight (only for arriving flights)
        runway:
          type:
          - string
          - 'null'
          description: Name of a runway of landing (for arriving flights) or take-off (for departing flights), if known.
        quality:
          type: array
          items:
            $ref: '#/components/schemas/FlightAirportMovementQualityEnum'
          description: 'Array of quality characteristics of the data. Check this to know which information

            you can expect within this contract (basic, live and/or approximate data).'
      additionalProperties: false
      description: Flight arrival or departure information
    FlightContract:
      required:
      - arrival
      - codeshareStatus
      - departure
      - isCargo
      - lastUpdatedUtc
      - number
      - status
      type: object
      properties:
        greatCircleDistance:
          $ref: '#/components/schemas/Distance'
        departure:
          $ref: '#/components/schemas/FlightAirportMovementContract'
        arrival:
          $ref: '#/components/schemas/FlightAirportMovementContract'
        flightPlan:
          $ref: '#/components/schemas/FlightPlanContract'
        lastUpdatedUtc:
          type: string
          description: Time (UTC) of the latest update of flight information (excluding Location)
          format: date-time
        number:
          minLength: 1
          type: string
          description: Flight Number
        callSign:
          type:
          - string
          - 'null'
          description: ATC call-sign of the flight
        status:
          $ref: '#/components/schemas/FlightStatus'
        codeshareStatus:
          $ref: '#/components/schemas/CodeshareStatus'
        isCargo:
          type: boolean
          description: Is cargo flight
        aircraft:
          $ref: '#/components/schemas/FlightAircraftContract'
        airline:
          $ref: '#/components/schemas/FlightAirlineContract'
        location:
          $ref: '#/components/schemas/FlightLocationContract'
      additionalProperties: false
      description: Individiual flight contract
    FlightAirlineContract:
      required:
      - name
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: Airline name
        iata:
          type:
          - string
          - 'null'
          description: IATA code of the airline
        icao:
          type:
          - string
          - 'null'
          description: ICAO code of the airline
      additionalProperties: false
      description: Flight's airline reference conract
    AirportCodesByEnum:
      enum:
      - Icao
      - Iata
      type: string
      description: 'Search by airport code type<p>Possible values:</p>

        <ul>

        <li><b>0 - Icao</b>: ICAO-code</li>

        <li><b>1 - Iata</b>: IATA-code</li>

        </ul>

        '
    FlightSearchItemContract:
      required:
      - number
      type: object
      properties:
        number:
          minLength: 1
          type: string
          description: Found flight number.
      additionalProperties: false
      description: Flight record found in the search result.
    FlightAirportMovementQualityEnum:
      enum:
      - Basic
      - Live
      - Approximate
      type: string
      description: 'Quality characteristics of the information provided within flight FlightAirportMovementContract<p>Possible values:</p>

        <ul>

        <li><b>0 - Basic</b></li>

        <li><b>1 - Live</b></li>

        <li><b>2 - Approximate</b></li>

        </ul>

        '
    Distance:
      required:
      - feet
      - km
      - meter
      - mile
      - nm
      type: object
      properties:
        meter:
          type: number
          description: Distance in meters
          format: double
        km:
          type: number
          description: Distance in kilometers
          format: double
        mile:
          type: number
          description: Distance in statute miles
          format: double
        nm:
          type: number
          description: Distance in nautical miles
          format: double
        feet:
          type: number
          description: Distance in feet
          format: double
      additionalProperties: false
    ErrorContract:
      required:
      - message
      type: object
      properties:
        message:
          minLength: 1
