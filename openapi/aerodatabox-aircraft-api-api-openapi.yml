        required: true
        schema:
          maxLength: 10
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AircraftRegistrationContract'
              examples:
                GetAircraftRegistrations200Example:
                  summary: Default GetAircraftRegistrations 200 response
                  x-microcks-default: true
