components:
  schemas:
    SubscriptionSubjectContract:
      required:
      - type
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SubscriptionSubjectType'
        id:
          type:
          - string
          - 'null'
          description: 'Subject ID of a subscription. Complements SubjectType.


            E.g. SubjectType = "FlightNumber" and SubjectId = "DL 47" means that this

            subscription is for all updates of flight with number DL47.'
      additionalProperties: false
      description: Describes subscription subject
    FlightPlanStatus:
      enum:
