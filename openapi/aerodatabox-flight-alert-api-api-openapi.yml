      value: Please Login/Signup to get an API Key
      required: true
      schema:
        type: string
    patch:
      tags:
      - Flight Alert API
      summary: AeroDataBox Refresh Web-hook Subscription (DEPRECATED) / TIER 4
      description: " *This endpoitns is a part of Flight alert PUSH API currently powered by webhooks.  \r\n If you are running your own web service, you can subscribe to flights by number or airport code. \r\n After that, your HTTP endpoint will be called (notified) whenever the flight information gets \r\n updated.*\r\n \r\n Refreshes an existing web-hook subscription\r\n \r\n If the subscription had an expiration date-time set when created, this endpoint \r\n will extend it by the same period of time as the one it was originally created with. \r\n E.g., if subscription was originally created for 7 days, this endpoint will\r\n add extra 7 days to the expiration date-time. Note, that web-hook subscriptions\r\n cannot be extended beyond the sliding window of 60 days from the current date-time. \r\n \r\n If the subscription had no expiration date-time set, nothing occurs.\r\n \r\n **! WARNING OF THE UPCOMING BREAKING CHANGES !**\r\n \r\n DUE TO TRANSITIONING TO A NEW CREDIT-BASED BILLING MODEL FOR WEB-HOOK SUBSCRIPTIONS, \r\n\tTHIS ENDPOINT WILL BE DEPRECATED AND REMOVED LATER ON.\r\n\r\n **MIGRATION GUIDE / LEARN MORE**\r\n \r\n Read our guide at https://aerodatabox.com/flight-alert-api-2026/"
      operationId: RefreshWebhook
      parameters:
      - name: subscriptionId
        in: path
        description: Subscription ID
        required: true
        schema:
          type: string
          format: uuid
      - name: useCredits
        in: query
        description: "THIS IS A TEMPORARY MIGRATION PARAMETER FOR EASIER TRANSITION. \r\nDefault value: false.\r\nSet to true to refresh an existing web-hook subscription under the new, credit-based billing model. In this case, the call will be free of charge despite Tier 4."
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionContract'
              examples:
                RefreshWebhook200Example:
                  summary: Default RefreshWebhook 200 response
                  x-microcks-default: true
                  value:
                    id: abc123
                    isActive: true
                    billingType: example_value
                    activateBeforeUtc: '2025-03-15T14:30:00Z'
                    expiresOnUtc: '2025-03-15T14:30:00Z'
                    createdOnUtc: '2025-03-15T14:30:00Z'
                    subject: example_value
                    subscriber: example_value
                    notices:
                    - example_value
            application/xml:
              schema:
                $ref: '#/components/schemas/SubscriptionContract'
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContract'
              examples:
                RefreshWebhook400Example:
                  summary: Default RefreshWebhook 400 response
                  x-microcks-default: true
                  value:
                    message: example_value
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorContract'
        '401':
