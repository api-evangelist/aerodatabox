        <ul>

        <li><b>0 - LifetimeBased</b>: Subscription billed upon creation based on the life-time with set expiration date-time (BEING DEPRECATED)</li>

        <li><b>1 - CreditBased</b>: Subscription with no expiration date, billed based on the amount of notifications sent</li>

        </ul>

        '
    ResourceContract:
