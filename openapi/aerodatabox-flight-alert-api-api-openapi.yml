      description: 'Performs refill operation on the web-hook subscription balance by the specified amount of credits.

        This balance is separate from your API marketplace quota and is used solely for billing of web-hook subscriptions.


        In the request body, you specify how many credits you want to add. This is a variable-rate endpoint and the amount of API units

        deducted from your API quota depends on the amount of flight alerts credits requested.

        The conversion rate is: 1 credit = 1 API unit.


        Additional limits apply with regard to how many credits you can request per single refill operation and how many credits

        you can have in your balance at any given time. These limits depend on your pricing plan (https://aerodatabox.com/pricing).


        For more details about how flight alert API billing works, refer to our guide at https://aerodatabox.com/flight-alert-api-2026/'
