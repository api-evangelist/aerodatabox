        lon:
          maximum: 180
          minimum: -180
          type: number
          description: Longitude, in degrees
          format: float
      additionalProperties: false
      description: Geographical coordinates data
    CreateWebHookSubscription:
      required:
      - url
      type: object
      properties:
        url:
          minLength: 1
          type: string
          description: 'Destination HTTP-endpoint where notifications will be sent to. Requirements:

            * must be a valid public HTTP(S) URL not requiring additional authorization;

            * must use standard or alternative HTTP or HTTPS ports (80, 443, 8008, 8080) or any dynamic port greater or equal to 49152;

            * must be able to accept HTTP POST request with JSON-formatted body (application/json);

            * must respond with one of successful HTTP status codes (2XX) within 10 seconds;

            * the endpoint owner must be aware of and consent to receiving notifications at it.


            If endpoint is unavailable, responds with error status code or does not respond within timeout,

            notification delivery retry may be attempted according to subscription settings.'
        maxDeliveryRetries:
          maximum: 2
          minimum: 0
          type:
          - integer
          - 'null'
          description: "Maximum number of times a delivery attempt is retried after initial delivery attempt failure.\n\nCurrent default value is:\n\n\t* `2` for the old, lifetime-based web-hook subscriptions (will be phased out after the 4th of April, 2026);\n\t* `0` for the new, credit-based web-hook subscriptions (will be the default value for any web-hook subscription after the 4th of April, 2026)."
          format: int32
      additionalProperties: false
      description: Command to create web-hook subscription
    Azimuth:
