  /airports/{codeType}/{code}/stats/routes/daily:
    parameters:
    - description: API.market API Key
      in: header
      name: x-api-market-key
      value: Please Login/Signup to get an API Key
      required: true
      schema:
        type: string
    get:
      tags:
      - Statistical API
      summary: AeroDataBox Airport Routes and Daily Flight Destinations / TIER 3
      description: '**What are the most popular routes from an airport?** or **Where I can fly from an airport?** or

        **How many daily flights to different destinations from an airport?**


        The data will only be available for airports which have at least schedules information available.

        If the airport is also covered with live or ADS-B coverage, the quality will improve greatly as it will

        be based on real data rather than on static scheduled data. To check if an airport is tracked and on which level,

        use `/health/services/airports/{icao}/feeds` endpoint. You can also use `/health/services/feeds/{service}/airports` to get

        the list of covered airports.


        At the moment airports having both ICAO and IATA code and flight schedules are present available only.


        *Returns:* List of routes and daily flights amount departing from an airport.'
      operationId: GetRouteDailyStatistics_RoutesDailyCurrent
      parameters:
      - name: codeType
        in: path
        description: Type of code to search airport by (`iata` or `icao`)
        schema:
          $ref: '#/components/schemas/AirportCodesByEnum'
      - name: code
        in: path
        description: 'If `codeType` is:

          * `icao`, then this field must be a 4-character ICAO-code of the airport (e.g.: EHAM, KLAX, UUEE, etc.);

          * `iata`, then this field must be a 3-character IATA-code of the airport (e.g.: AMS, SFO, LAX, etc.).


          Full, stripped and any case formats are acceptable.'
        required: true
        schema:
          maxLength: 4
          minLength: 3
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRouteStatContract'
              examples:
                GetRouteDailyStatistics_RoutesDailyCurrent200Example:
                  summary: Default GetRouteDailyStatistics_RoutesDailyCurrent 200 response
                  x-microcks-default: true
                  value:
                    routes:
                    - example_value
