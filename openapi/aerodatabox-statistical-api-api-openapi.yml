      - Statistical API
      summary: AeroDataBox Global Delays (current or Historical Moment) / TIER 3
      description: '**What is the current or historical delay situation in all airports?** or **What is the delay index of all airports globally right now or at a moment in past?**


        Please read more about airport delays on here: https://aerodatabox.com/api-airport-delays/


        *Returns*: Statistical delay information about delays (median delay, delay index, cancelled flights) of arrivals and departures for all known airports, represented by a collection of items sorted by

        the average of arrival and departure index, descending order (from worst to best). Only qualifying and recent enough delay statistics records are returned.'
      operationId: GetGlobalDelays_GlobalDelaysCurent
      responses:
        '200':
          description: OK
          content:
