              schema:
                $ref: '#/components/schemas/ErrorContract'
              examples:
                GetAirportDelay_DelaysHistorical451Example:
                  summary: Default GetAirportDelay_DelaysHistorical 451 response
                  x-microcks-default: true
                  value:
                    message: example_value
            application/xml:
              schema:
