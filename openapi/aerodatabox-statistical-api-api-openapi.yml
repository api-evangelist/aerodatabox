              examples:
                GetRouteDailyStatistics_RoutesDailyCurrent451Example:
                  summary: Default GetRouteDailyStatistics_RoutesDailyCurrent 451 response
                  x-microcks-default: true
                  value:
                    message: example_value
            application/xml:
