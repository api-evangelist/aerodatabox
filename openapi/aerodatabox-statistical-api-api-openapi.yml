                  summary: Default GetAirportDelays 200 response
                  x-microcks-default: true
                  value:
                  - example_value
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AirportDelayContract'
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
